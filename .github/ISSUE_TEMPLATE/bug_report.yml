name: Bug report
description: Report a sync or installation problem without sharing conversation data.
body:
  - type: markdown
    attributes:
      value: "Please do not attach databases, transcripts, credentials, backups or unredacted logs."
  - type: input
    id: versions
    attributes:
      label: Windows, T3, Python and Node.js versions
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and a redacted error reason.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic data
      description: Describe the steps without pasting private conversation content.
